plugins {
    id 'net.neoforged.moddev' version '2.0.107' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.107' apply false
}

subprojects {
    apply plugin: 'java'
    
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://maven.createmod.net" }
        maven { url = "https://maven.neoforged.net/releases" }
    }
}
