name: Build

on:
  push:
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test all targets
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Two JDKs are genuinely needed: neoforge/1211 declares a Java 21 toolchain,
      # while neoforge/1201, fabric/1201 and common target Java 17. Gradle itself runs
      # on 21 (the last one installed) and picks up 17 through the fromEnv property set
      # below.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Point Gradle at both toolchains
        run: |
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64" >> gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Run the headless tests first: they finish in seconds, so a broken build is
      # reported long before Minecraft has finished decompiling.
      - name: Headless tests
        run: ./gradlew :common:test --stacktrace

      - name: Build all targets
        run: ./gradlew build --stacktrace

      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: common/build/reports/tests/test
          retention-days: 7

      - name: Upload built jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            neoforge/1201/build/libs/*.jar
            neoforge/1211/build/libs/*.jar
            fabric/1201/build/libs/*.jar
          retention-days: 14
