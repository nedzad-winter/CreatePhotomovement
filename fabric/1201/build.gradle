plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = mod_version
group = 'com.createphotomovement'
base.archivesName = "createphotomovement-fabric-${minecraft_version}"

// Code shared by all three targets. Each target compiles these same files against its
// own Minecraft version and loader, so anything loader-specific here breaks the other
// builds immediately -- that is the point.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://mvn.devos.one/snapshots/" } // Create, Registrate, Milk Lib
    maven { url = "https://mvn.devos.one/releases/" } // Porting Lib
    maven { url = "https://maven.createmod.net/" } // Flywheel, Ponder
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" } // Forge Config API Port
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
    maven { url = "https://maven.blamejared.com" } // JEI
    maven { url = "https://api.modrinth.com/maven" } // LazyDFU, Jade
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
            programArgs("--width", "1600", "--height", "1024", "--quickPlaySingleplayer", "CPM Testwork")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run/server")
        }

        // Headless in-game tests, the Fabric API equivalent of NeoForge's
        // gameTestServer run.
        //   gradlew :fabric:1201:runGametest
        gametest {
            server()
            setConfigName("Game Test")
            ideConfigGenerated(false)
            runDir("build/gametest")
            vmArg("-Dfabric-api.gametest")
            vmArg("-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest-report.xml")
        }
    }
}

dependencies {
    // Minecraft and mappings
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    
    // Fabric Loader and API
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    
    // Create Fabric (Official Repo)
    modImplementation("com.simibubi.create:create-fabric:${create_version}")

    // Forge Config API Port
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"
    
    // Development Utilities
    modRuntimeOnly "maven.modrinth:lazydfu:0.1.3"
    
    // JEI for testing
    modRuntimeOnly "mezz.jei:jei-1.20.1-fabric:15.20.0.106"

    // Jade (Waila) for tag troubleshooting
    modImplementation "maven.modrinth:jade:11.9.2+fabric"
}

configurations.all {
    resolutionStrategy {
        force "net.fabricmc:fabric-loader:${fabric_loader_version}"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}



tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property "version", mod_version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    filesMatching("fabric.mod.json") {
        expand "version": mod_version
    }
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
    manifest {
        attributes([
            "Specification-Title": mod_name,
            "Specification-Vendor": mod_authors,
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
