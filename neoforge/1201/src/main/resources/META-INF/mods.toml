modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/example/createphotomovement/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Works with both Forge and NeoForge for 1.20.1
[[dependencies.createphotomovement]]
modId = "forge"
mandatory = false
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.createphotomovement]]
modId = "neoforge"
mandatory = false
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.createphotomovement]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"

[[dependencies.createphotomovement]]
modId = "create"
mandatory = true
versionRange = "[6.0,)"
ordering = "AFTER"
side = "BOTH"
