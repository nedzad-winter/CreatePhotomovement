plugins {
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.107'
}

version = mod_version
group = 'com.createphotomovement'
base.archivesName = "createphotomovement-neoforge-${minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Compatible with both Forge and NeoForge 1.20.1
    version = "${minecraft_version}-${forge_version}"

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
            gameDirectory = project.file('run')
        }

        server {
            server()
            gameDirectory = project.file('run/server')
        }

        data {
            data()
            gameDirectory = project.file('run')
            programArguments.addAll(
                '--mod', mod_id as String,
                '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources').getAbsolutePath()
            )
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" } // NeoForge
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/mirror" } // Registrate
    maven { url = "https://maven.blamejared.com" } // JEI
    maven { url = "https://maven.theillusivec4.top/" } // Curios
    maven { url = "https://api.modrinth.com/maven" } // Modrinth
    maven { url = "https://maven.architectury.dev/" } // Architectury
    maven { url = "https://maven.saps.dev/minecraft" } // FTB Mods
    maven { url = "https://maven.squiddev.cc" } // CC: Tweaked
    maven { url = "https://cursemaven.com" } // CurseMaven
}

dependencies {
    // Create mod dependency
    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }

    // Flywheel (rendering library for Create)
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    
    // Vanillin (Flywheel dependency)
    modRuntimeOnly("dev.engine-room.vanillin:vanillin-forge-${minecraft_version}:1.0.0")

    // Ponder (Create's tutorial system)
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")

    // Registrate (registration helper)
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    
    // MixinExtras (required by Create)
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))

    // JEI (Just Enough Items)
    //modCompileOnly("mezz.jei:jei-1.20.1-common-api:15.19.0")
    //modCompileOnly("mezz.jei:jei-1.20.1-forge-api:15.19.0")
    //modRuntimeOnly("mezz.jei:jei-1.20.1-forge:15.19.0")
}

jar {
    manifest {
        attributes([
            "Specification-Title": mod_name,
            "Specification-Vendor": mod_authors,
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor" : mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Process resources to expand gradle properties
processResources {
    def resourceTargets = [
        'META-INF/mods.toml',
        'pack.mcmeta'
    ]
    def replaceProperties = [
        mod_id: mod_id,
        mod_version: mod_version,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_authors: mod_authors,
        mod_description: mod_description,
        minecraft_version: minecraft_version,
        forge_version: forge_version
    ]
    inputs.properties replaceProperties
    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}
