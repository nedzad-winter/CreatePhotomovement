plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'com.createphotomovement'
version = mod_version
base.archivesName = "createphotomovement-neoforge-${minecraft_version}"

// Code shared by all three targets. Each target compiles these same files against its
// own Minecraft version and loader, so anything loader-specific here breaks the other
// builds immediately -- that is the point.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate

    // Needed for Create's transitive RUNTIME dependencies, not for compiling. A plain
    // `gradlew build` resolves only the compile classpath and stays green without
    // these; the run configurations resolve the runtime classpath and do not.
    maven { url = "https://maven.theillusivec4.top/" } // Curios
    maven { url = "https://maven.blamejared.com" } // JEI
    maven { url = "https://api.modrinth.com/maven" } // Modrinth
    maven { url = "https://maven.architectury.dev/" } // Architectury
    maven { url = "https://maven.saps.dev/minecraft" } // FTB Mods
    maven { url = "https://maven.squiddev.cc" } // CC: Tweaked
    maven { url = "https://cursemaven.com" } // CurseMaven
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        exclude group: 'dev.ftb.mods'
        exclude group: 'dev.architectury'
        exclude group: 'maven.modrinth'
        exclude group: 'cc.tweaked'
    }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    implementation "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
}

neoForge {
    version = neo_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
            programArguments.addAll '--width', '1600', '--height', '900', '--quickPlaySingleplayer', 'CPM Testwork'
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // Headless in-game tests. Boots a dedicated server, runs every @GameTest in
        // our namespace and exits with a non-zero code if any of them fail.
        //   gradlew :neoforge:1211:runGameTestServer
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Process resources to expand gradle properties
processResources {
    def resourceTargets = [
        'META-INF/neoforge.mods.toml',
        'pack.mcmeta'
    ]
    def replaceProperties = [
        mod_id: mod_id,
        mod_version: mod_version,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_authors: mod_authors,
        mod_description: mod_description,
        minecraft_version: minecraft_version,
        neo_version: neo_version
    ]
    inputs.properties replaceProperties
    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}
